<!doctype html>
<html lang="ar" dir="ltr">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  <title>Tauri + Vue + Typescript App</title>
</head>

<body>
  <script>
    // iOS WKWebView viewport height fix (WebKit Bug 191872).
    // With viewport-fit=cover, the initial containing block height may exclude
    // safe areas, making CSS height:100% too short. screen.height is always the
    // true full-screen height in CSS pixels, so we use it to bypass the bug.
    if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
      document.documentElement.style.setProperty('--app-height', screen.height + 'px');
    }
  </script>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
